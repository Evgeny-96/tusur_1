<div class="pagination monts">
   <button type="button" class="pagination__btn">
      <span class="pagination__btn-text">Назад</span>
      <svg class="arrow__icon">
         <use xlink:href="assets/icons/symbols.svg#arrow_prev"></use>
      </svg>
   </button>
   <div class="pagination__number-block">
      <div class="pagination__number">1</div>
      <div class="pagination__number">2</div>
      <div class="pagination__number active">3</div>
      <div class="pagination__number">4</div>
      <div class="pagination__number">5</div>
      <div class="pagination__number">6</div>
      <div class="pagination__number">...</div>
      <div class="pagination__number">11</div>
   </div>   
   <button type="button" class="pagination__btn">
      <span class="pagination__btn-text">Вперед</span>
      <svg class="arrow__icon">
         <use xlink:href="assets/icons/symbols.svg#arrow_next"></use>
      </svg>
   </button>
</div>
