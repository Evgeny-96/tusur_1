@@slide-start
<article class="posters-card">
   <picture class="posters-card__picture @@class">
      <source media="(max-width: 450px)" type="image/webp" srcset="@@img_mob_webp" />
      <source media="(max-width: 450px)" srcset="@@img_mob" />
      <source media="(max-width: 1169px)" type="image/webp" srcset="@@img_tablet_webp" />
      <source media="(max-width: 1169px)" srcset="@@img_tablet" />
      <source type="image/webp" srcset="@@img_webp" />
      <img src="@@img" alt="@@alt" class="posters-card__img" />
   </picture>
   <p class="posters-card__descr monts">@@descr</p>
</article>
@@slide-end
